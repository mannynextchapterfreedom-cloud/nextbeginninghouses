  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #000;

      position: relative;

    /* Lightning flash effect */
    @keyframes lightning {

      92% { background-color: #fff; }
      95% { background-color: #000; }
      97% { background-color: #fff; }
    }
    body.flash {

    header {

    h1 {

    }

    .cta-button {

      background: #FFD700;
      color: #000;

      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.3s ease;

    }

    footer {
      text-align: center;
      padding: 20px;
      color: #aaa;
      font-size: 0.9rem;
      background: #111;
    }

    /* Raining money effect */
    .money {
      position: fixed;
      top: -50px;
      font-size: 24px;
      color: #00ff00;
      pointer-events: none;
      animation: fall linear forwards;

  <script>
    // Generate raining money 💵
    function createMoney() {
      const money = document.createElement('div');
      money.classList.add('money');
      money.style.left = Math.random() * 100 + 'vw';
      money.style.animationDuration = (3 + Math.random() * 2) + 's';
      money.innerText = '💵';
      document.body.appendChild(money);

      setTimeout(() => { money.remove(); }, 5000);
    }

    setInterval(createMoney, 500);
  </script>
